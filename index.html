<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Кабинет Мостика</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F4F6F9;--card:#FFFFFF;--line:#DDE3EA;--line2:#EEF1F5;--text:#1A2230;--muted:#4A5565;--muted2:#5B6472;
  --head:#0F2A44;--headText:#FFFFFF;--headMuted:#C9D6E6;--accent:#1E5AA8;--accentText:#FFFFFF;--accentSoft:#EAF1FB;
  --red:#B42318;--redSoft:#FDECEA;--lateBg:#FFF8F7;
  --s-new-bg:#EEF0F3;--s-new:#3D4452;--s-work-bg:#E3ECFF;--s-work:#1D4ED8;--s-pause-bg:#FFF1DB;--s-pause:#8A4B00;
  --s-rev-bg:#F0E8FF;--s-rev:#6B2FBF;--s-done-bg:#E2F5EA;--s-done:#17663A;--s-cancel-bg:#F1F1F1;--s-cancel:#5F5F5F;
}
html[data-theme="dark"]{
  --bg:#0E1621;--card:#17212B;--line:#2B3846;--line2:#22303D;--text:#E8EDF3;--muted:#B3BECA;--muted2:#98A5B3;
  --head:#0B1E31;--headText:#FFFFFF;--headMuted:#A9BCD2;--accent:#5A9BEA;--accentText:#0B1E31;--accentSoft:#1D3350;
  --red:#FF7A6E;--redSoft:#3A1E1E;--lateBg:#24191B;
  --s-new-bg:#26313D;--s-new:#C9D2DC;--s-work-bg:#1C2F4F;--s-work:#8DB8FF;--s-pause-bg:#3A2A12;--s-pause:#F2B661;
  --s-rev-bg:#2E2245;--s-rev:#C9A7FF;--s-done-bg:#16301F;--s-done:#7FD39C;--s-cancel-bg:#262A2E;--s-cancel:#A0A6AC;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hdr{background:var(--head);color:var(--headText);padding:14px 16px 12px;display:flex;flex-direction:column;gap:12px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr h1{margin:0;font-size:19px}
.hdr small{display:block;color:var(--headMuted);font-size:12px;margin-top:2px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:var(--headText);display:inline-flex;align-items:center;justify-content:center;flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:38px;border:0;border-radius:8px;background:transparent;color:var(--headMuted);font-size:14px}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:#0F2A44;font-weight:600}
.tabs{display:flex;gap:4px;padding:10px 16px 0;background:var(--bg);position:sticky;top:0;z-index:5}
.tabs button{flex:1;min-height:42px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:500}
.tabs button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.wrap{padding:12px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:64px}
.tile b{font-size:22px;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.tile[aria-pressed="true"]{border:2px solid var(--accent);padding:9px;background:var(--accentSoft)}
.tile.warn b{color:var(--red)}
.search{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.search input{flex:1;border:0;outline:none;background:transparent;min-width:0;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accentText);font-weight:600}
.chip i{font-style:normal;opacity:.75;margin-left:4px}
.chip-lbl{flex:none;align-self:center;font-size:12px;color:var(--muted);margin-right:2px}
select.chip{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.count{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.card{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card.late{box-shadow:inset 3px 0 0 var(--red);background:var(--lateBg)}
.r1,.r2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ttl{font-weight:600;line-height:1.3}
.r2{font-size:13px;color:var(--muted);align-items:center}
.due{flex:none;font-weight:600;color:var(--text);white-space:nowrap}
.red{color:var(--red)!important}
.hint{font-size:12px;color:var(--muted2)}
.urg{display:inline-block;font-size:11px;font-weight:700;color:var(--red);background:var(--redSoft);border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.badge{flex:none;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st-new{background:var(--s-new-bg);color:var(--s-new)}.st-work{background:var(--s-work-bg);color:var(--s-work)}
.st-pause{background:var(--s-pause-bg);color:var(--s-pause)}.st-rev{background:var(--s-rev-bg);color:var(--s-rev)}
.st-done{background:var(--s-done-bg);color:var(--s-done)}.st-cancel{background:var(--s-cancel-bg);color:var(--s-cancel)}
.clip{display:inline-flex;align-items:center;gap:3px}
.empty{padding:32px 12px;text-align:center;color:var(--muted)}
.empty button{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0}
.board{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px}
.col{flex:none;width:82%;max-width:340px;scroll-snap-align:start;background:var(--line2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;align-self:flex-start}
.col h3{margin:0;font-size:14px;display:flex;justify-content:space-between;padding:2px 4px}
.person{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.p-top{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#FFFFFF;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stats div{background:var(--bg);border-radius:8px;padding:8px;display:flex;flex-direction:column}
.stats b{font-size:17px}.stats span{font-size:11px;color:var(--muted)}
.next{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid var(--line2)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentText)}
.banner{padding:10px 12px;border-radius:10px;background:var(--s-pause-bg);color:var(--s-pause);font-size:13px}
.msg{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:16px;align-items:center}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .wrap{gap:14px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-top h2{margin:0;font-size:20px;line-height:1.3}
.close{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);flex:none;display:inline-flex;align-items:center;justify-content:center}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.fields span{display:block;font-size:12px;color:var(--muted)}
.fields b{font-weight:500;word-break:break-word}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.box>span{font-size:12px;color:var(--muted)}
.note{padding:10px 12px;border-radius:10px;font-size:14px}
.note.pause{background:var(--s-pause-bg);color:var(--s-pause)}.note.ret{background:var(--redSoft);color:var(--red)}
.hist{display:flex;gap:10px;font-size:14px}.hist span{color:var(--muted);min-width:86px}
.file{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:left;width:100%}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted);font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{flex:1 1 calc(50% - 4px)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.55}
.inp{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;resize:vertical}
.box label{font-size:13px;color:var(--muted)}
.row-inp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;background:var(--head);color:var(--headText);padding:12px 16px;border-radius:12px;text-align:center;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
// ===== Кабинет «Капитанского мостика» — мини-приложение Telegram =====
// Данные приходят из n8n (сценарий «Мостик — Кабинет»), он проверяет подпись Telegram и роль.
var API = 'https://divetro.app.n8n.cloud/webhook/mostik-kabinet';
var Z = 'Europe/Chisinau';
var CLOSED = ['Принята', 'Отменена'];
var tg = window.Telegram && window.Telegram.WebApp;
var DATA = null, DEMO = false, ERR = '', LOADING = true;
var S = { tab: 'list', scope: 'all', view: 'open', who: 'all', pri: 'all', kind: 'all', q: '', sel: null };
try { var saved = JSON.parse(localStorage.getItem('mostik-cab') || '{}'); ['tab', 'scope', 'view'].forEach(function (k) { if (saved[k]) S[k] = saved[k]; }); } catch (e) {}
function savePrefs() { try { localStorage.setItem('mostik-cab', JSON.stringify({ tab: S.tab, scope: S.scope, view: S.view })); } catch (e) {} }

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
var fDay = new Intl.DateTimeFormat('en-CA', { timeZone: Z, year: 'numeric', month: '2-digit', day: '2-digit' });
var fHM = new Intl.DateTimeFormat('ru-RU', { timeZone: Z, hour: '2-digit', minute: '2-digit' });
var fDM = new Intl.DateTimeFormat('ru-RU', { timeZone: Z, day: '2-digit', month: '2-digit' });
var fWD = new Intl.DateTimeFormat('ru-RU', { timeZone: Z, weekday: 'short' });
function stamp(s) { if (!s) return ''; var d = new Date(s); return isNaN(d) ? '' : fDM.format(d) + ' ' + fHM.format(d); }
function ago(ms) {
  var m = Math.max(1, Math.round(ms / 6e4)); if (m < 60) return m + ' мин';
  var h = Math.floor(m / 60); if (h < 24) return h + ' ч' + (m % 60 ? ' ' + (m % 60) + ' мин' : '');
  return Math.floor(h / 24) + ' дн';
}
function isOpen(t) { return CLOSED.indexOf(t.st) < 0; }
function dueInfo(t, now) {
  if (!t.due) return { lbl: 'без срока', hint: '', late: false, today: false, ts: 9e15 };
  var d = new Date(t.due), ts = +d;
  if (isNaN(ts)) return { lbl: 'без срока', hint: '', late: false, today: false, ts: 9e15 };
  var k = fDay.format(d), kn = fDay.format(now), kt = fDay.format(new Date(+now + 864e5));
  var lbl = (k === kn ? 'сегодня ' : k === kt ? 'завтра ' : fWD.format(d) + ' ' + fDM.format(d) + ' ') + fHM.format(d);
  var open = isOpen(t);
  var late = open && t.st !== 'На проверке' && ts < +now;
  var hint = '';
  if (late) hint = 'просрочено на ' + ago(+now - ts);
  else if (t.st === 'На проверке') hint = 'ждёт проверки' + (t.rv ? ' с ' + stamp(t.rv) : '');
  else if (open && k === kn) hint = 'через ' + ago(ts - +now);
  return { lbl: lbl, hint: hint, late: late, today: open && k === kn, ts: ts };
}
var ST_CLS = { 'Создана': 'st-new', 'В работе': 'st-work', 'На паузе': 'st-pause', 'На проверке': 'st-rev', 'Принята': 'st-done', 'Отменена': 'st-cancel' };
var AV = ['#1E5AA8', '#7A3EB1', '#17663A', '#B45309', '#0E7C86', '#9D2B5B', '#0F2A44', '#5B6472'];
function avColor(id) { var h = 0, s = String(id || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return AV[h % AV.length]; }

var ICON = {
  refresh: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3.5L4 9"></path><path d="M4 4v5h5"></path><path d="M4 13a8 8 0 0 0 14.9 3.5L20 15"></path><path d="M20 20v-5h-5"></path></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>',
  clip: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"></path></svg>',
  file: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>',
  close: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>'
};

// ---------- данные ----------
function tasksNow() {
  var now = new Date();
  return (DATA.tasks || []).map(function (t) { var x = Object.assign({}, t); x.di = dueInfo(t, now); return x; });
}
function inScope(t) {
  var me = DATA.me.id;
  if (S.scope === 'mine') return t.whoId === me || (!t.whoId && t.fromId === me);
  if (S.scope === 'set') return t.fromId === me && t.whoId !== me;
  return true;
}
var VIEWS = [
  ['open', 'открытые', function (t) { return isOpen(t); }],
  ['overdue', 'просрочено', function (t) { return t.di.late; }],
  ['today', 'сегодня', function (t) { return t.di.today; }],
  ['review', 'на проверке', function (t) { return t.st === 'На проверке'; }],
  ['pause', 'на паузе', function (t) { return t.st === 'На паузе'; }],
  ['done', 'принятые', function (t) { return t.st === 'Принята'; }]
];
function viewFn(k) { for (var i = 0; i < VIEWS.length; i++) if (VIEWS[i][0] === k) return VIEWS[i][2]; return VIEWS[0][2]; }
function match(t, skip) {
  var q = S.q.trim().toLowerCase();
  return (skip === 'who' || S.who === 'all' || t.whoId === S.who) &&
    (skip === 'pri' || S.pri === 'all' || (t.pri || 'Обычно') === S.pri) &&
    (S.kind === 'all' || t.kind === S.kind) &&
    (!q || [t.t, t.ord, t.cl, t.who, t.from, t.desc].join(' ').toLowerCase().indexOf(q) >= 0);
}
function sortTasks(a, b) { return (b.di.late - a.di.late) || (a.di.ts - b.di.ts); }

// ---------- части экрана ----------
function cardHtml(t) {
  var sub = [t.ord, t.cl].filter(Boolean).join(' · ') || t.type || '';
  var files = (t.files || []).length;
  return '<button class="card' + (t.di.late ? ' late' : '') + '" data-act="sel" data-v="' + esc(t.id) + '">' +
    '<div class="r1"><span class="ttl">' + (t.pri === 'Срочно' ? '<span class="urg">Срочно</span>' : '') + esc(t.t || 'Без названия') + '</span>' +
    '<span class="badge ' + (ST_CLS[t.st] || 'st-new') + '">' + esc(t.st) + '</span></div>' +
    '<div class="r2"><span>' + esc(t.who || 'без исполнителя') + (sub ? ' · ' + esc(sub) : '') +
    (files ? ' · <span class="clip">' + ICON.clip + files + '</span>' : '') + '</span>' +
    '<span class="due' + (t.di.late ? ' red' : '') + '">' + esc(t.di.lbl) + '</span></div>' +
    (t.di.hint ? '<div class="hint' + (t.di.late ? ' red' : '') + '">' + esc(t.di.hint) + '</div>' : '') +
    '</button>';
}
function chip(act, val, label, on, n) {
  return '<button class="chip" data-act="' + act + '" data-v="' + esc(val) + '" aria-pressed="' + on + '">' + esc(label) + (n != null ? '<i>' + n + '</i>' : '') + '</button>';
}
function filtersHtml(base) {
  var h = '<label class="search"><span class="sr">Поиск</span>' + ICON.search +
    '<input id="q" type="search" placeholder="Задача, заказ, клиент, человек" value="' + esc(S.q) + '" autocomplete="off"></label>';
  var people = DATA.people || [];
  if (people.length > 1) {
    h += '<div class="chips"><span class="chip-lbl">Кто</span>' + chip('who', 'all', 'Все', S.who === 'all', base.filter(function (t) { return match(t, 'who'); }).length);
    people.forEach(function (p) {
      var n = base.filter(function (t) { return match(t, 'who') && t.whoId === p.id; }).length;
      h += chip('who', p.id, p.name, S.who === p.id, n);
    });
    h += '</div>';
  }
  h += '<div class="chips"><span class="chip-lbl">Приоритет</span>';
  ['all', 'Срочно', 'Важно', 'Обычно'].forEach(function (p) {
    var n = base.filter(function (t) { return match(t, 'pri') && (p === 'all' || (t.pri || 'Обычно') === p); }).length;
    h += chip('pri', p, p === 'all' ? 'Все' : p, S.pri === p, n);
  });
  var kinds = ['Клиенту', 'От поставщика', 'Внутреннее', 'Деньги', 'Гарантия'];
  h += '<label class="sr" for="kind">Вид обязательства</label><select id="kind" class="chip" aria-pressed="' + (S.kind !== 'all') + '">' +
    '<option value="all">Вид: все</option>' + kinds.map(function (k) { return '<option value="' + k + '"' + (S.kind === k ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></div>';
  return h;
}
function hasFilters() { return S.who !== 'all' || S.pri !== 'all' || S.kind !== 'all' || !!S.q.trim(); }
function resultsHtml() {
  var all = tasksNow().filter(inScope);
  if (S.tab === 'board') {
    var cols = [['Создана', 'Не взяты'], ['В работе', 'В работе'], ['На паузе', 'На паузе'], ['На проверке', 'На проверке'], ['Принята', 'Приняты (14 дн)']];
    var shown = all.filter(function (t) { return match(t); });
    return '<div class="board">' + cols.map(function (c) {
      var arr = shown.filter(function (t) { return t.st === c[0]; }).sort(sortTasks);
      return '<section class="col"><h3><span>' + c[1] + '</span><span>' + arr.length + '</span></h3>' +
        (arr.length ? arr.map(cardHtml).join('') : '<div class="muted" style="padding:8px 4px">пусто</div>') + '</section>';
    }).join('') + '</div>';
  }
  var rows = all.filter(viewFn(S.view)).filter(function (t) { return match(t); }).sort(sortTasks);
  var title = VIEWS.filter(function (v) { return v[0] === S.view; })[0][1];

function doAction(act, text, due) {

  var body = new URLSearchParams();

    return r.json();

    finish(!!(j && j.ok), j && j.ok ? j.answer : ((j && j.answer) || errText(j && j.error)));

function demoApply(t0, act, text, due) {
  var t = findTask(t0.id), me = DATA.me.id, now = new Date().toISOString();

  else if (act === 'pause') { t.st = 'На паузе'; t.ps = now; t.note = text; }
  else if (act === 'resume') { t.st = 'В работе'; t.ps = null; }
  else if (act === 'done') { if (t.whoId === me && t.fromId !== me) { t.st = 'На проверке'; t.rv = now; } else { t.st = 'Принята'; t.ac = now; } }
